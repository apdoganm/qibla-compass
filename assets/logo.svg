<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="اتجاه القبلة">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c96a"/>
      <stop offset="0.55" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#a37e14"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="57.5" rx="17" ry="3" fill="#000" opacity="0.14"/>
  <!-- top face -->
  <polygon points="32,5 55,17 32,29 9,17" fill="#262626"/>
  <!-- left face -->
  <polygon points="9,17 32,29 32,55 9,43" fill="#050505"/>
  <!-- right face -->
  <polygon points="32,29 55,17 55,43 32,55" fill="#171717"/>
  <!-- gold band (hizam) -->
  <polygon points="9,25 32,37 32,43 9,31" fill="url(#gold)"/>
  <polygon points="32,37 55,25 55,31 32,43" fill="#bd9425"/>
  <!-- band embroidery dots -->
  <g fill="#7a5c0a" opacity="0.85">
    <circle cx="15" cy="30.2" r="0.9"/>
    <circle cx="20.5" cy="33.2" r="0.9"/>
    <circle cx="26" cy="36.2" r="0.9"/>
    <circle cx="38" cy="36.2" r="0.9"/>
    <circle cx="43.5" cy="33.2" r="0.9"/>
    <circle cx="49" cy="30.2" r="0.9"/>
  </g>
  <!-- gold door on the right face -->
  <polygon points="40.5,40.2 47.5,36.5 47.5,47 40.5,50.7" fill="url(#gold)"/>
  <!-- top edge highlight -->
  <polyline points="9,17 32,29 55,17" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
</svg>
